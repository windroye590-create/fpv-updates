name: Перевірити автоматизацію випуску

on:
  push:
    branches: [main, 'automation/**']
    paths: ['source/**', 'release-tools/**', 'automation.json', '.github/workflows/release.yml', '.github/workflows/verify-release-automation.yml']
  pull_request:
    paths: ['source/**', 'release-tools/**', 'automation.json', '.github/workflows/release.yml', '.github/workflows/verify-release-automation.yml']
  workflow_dispatch:
    inputs:
      check_credentials:
        description: 'Також перевірити доступ Google і оригінальний ключ (без розгортання)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify both portable tools through the raw cache only in Windows PowerShell 5.1
        shell: powershell
        run: ./release-tools/setup-automation.ps1 -CheckOnly -CheckBootstrap -MirrorOnly
      - name: Validate setup in PowerShell 7 without installing tools or signing in
        shell: pwsh
        run: ./release-tools/setup-automation.ps1 -CheckOnly
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==12.3.0 cryptography==50.0.2 openpyxl==3.1.5
      - name: Check actual credentials without deployment
        if: github.event_name == 'workflow_dispatch' && inputs.check_credentials && github.ref == 'refs/heads/main'
        env:
          GAS_CREDENTIALS: ${{ secrets.GAS_CREDENTIALS }}
          LK_SIGNING_PKCS12_BASE64: ${{ secrets.LK_SIGNING_PKCS12_BASE64 }}
          LK_SIGNING_PASSWORD: ${{ secrets.LK_SIGNING_PASSWORD }}
        run: |
          python3 release-tools/release_pipeline.py check-secrets
          python3 release-tools/appscript_deploy.py check --receipt "$RUNNER_TEMP/setup-check.json"
      - name: Test deployment rollback, concurrency and publication safeguards
        run: python3 -m unittest discover -s release-tools/tests -p 'test_*.py'
      - name: Run application regressions
        run: |
          npm --prefix source test
          python3 source/tests/native_identity.py
      - name: Build and verify Windows EXE
        env:
          COMMISSION_ALLOW_UNCONFIGURED_TEST: '1'
        working-directory: source
        run: |
          python3 build_windows.py
          python3 tests/validate_pe.py
          python3 tests/packed_image.py build/FPV-Komisiia-PC.exe --root . --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-identity-candidate
          path: source/build/FPV-Komisiia-PC.exe
          if-no-files-found: error
      - name: Verify result layout and startup from EXE
        working-directory: source
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium
          node tests/pdf-export-ui.mjs
          node tests/private-storage-ui.mjs
          node tests/excel-report-ui.mjs
          node tests/cadet-card-ui.mjs
          node tests/section-filters-ui.mjs
          node tests/results-ui.mjs
          node tests/responsive-ui.mjs
          node tests/packaged-startup.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: automation-verification
          path: |
            source/verification/*.json
            source/verification/results-actions-layout.png
            ${{ runner.temp }}/setup-check.json
          if-no-files-found: warn
  windows-identity:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: windows-identity-candidate
          path: candidate
      - name: Retrieve pinned previously shipped executables
        shell: pwsh
        run: |
          $originalUrl = 'https://raw.githubusercontent.com/windroye590-create/litakova-updates/499632333767e1d4fef04813e8abb7746439116c/channel/Litakova-Komisiia-PC.exe'
          $previousUrl = 'https://raw.githubusercontent.com/windroye590-create/fpv-updates/946c6d3c328c5c11ef06060044db81e0ed237939/channel/FPV-Komisiia-PC.exe'
          Invoke-WebRequest $originalUrl -OutFile candidate/Litakova-Komisiia-PC.exe -MaximumRetryCount 3 -RetryIntervalSec 3
          Invoke-WebRequest $previousUrl -OutFile candidate/FPV-previous.exe -MaximumRetryCount 3 -RetryIntervalSec 3
          if ((Get-FileHash candidate/Litakova-Komisiia-PC.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '82938f3d0c44bc0d7887285808b8afba1ad1e3390712d66501a97a45bbd06759') { throw 'Unexpected Litakova executable' }
          if ((Get-FileHash candidate/FPV-previous.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2dfa4dbb1585edbd25df79bc59e5de7ef96947716b82424aded1023098d26691') { throw 'Unexpected previous FPV executable' }
      - name: Verify encrypted storage in the candidate Windows host
        run: python source/tests/windows-private-storage.py candidate/FPV-Komisiia-PC.exe windows-private-storage.json
      - name: Verify migration, simultaneous launch, taskbar identity and window icons
        run: python source/tests/windows-edition-identity.py candidate/FPV-Komisiia-PC.exe candidate/FPV-previous.exe candidate/Litakova-Komisiia-PC.exe windows-identity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-edition-identity
          path: |
            windows-identity/*
            windows-private-storage.json
          if-no-files-found: warn
